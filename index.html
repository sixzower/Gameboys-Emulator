</script><script>// Browser-side D1 compatibility adapter. Only activated after database migration.
// Preserves existing UI and Supabase-like calls, but never contacts Supabase in D1 mode.
(()=>{
 'use strict';
 const cfg=window.GB_MIGRATION||{};
 const endpoint=String(cfg.workerUrl||'').replace(/\/+$/,'');
 const enabled=cfg.useD1===true&&/^https:\/\//.test(endpoint);
 const call=async(path,body,adminPassword='',opts={})=>{
  const response=await fetch(endpoint+path,{
   method:'POST',headers:{'Content-Type':'application/json',...(adminPassword?{'X-Emulator-Admin':adminPassword}:{})},
   body:JSON.stringify(body),signal:opts.signal,keepalive:opts.keepalive===true
  });
  const result=await response.json().catch(()=>({error:'Database service returned invalid JSON'}));
  if(!response.ok)throw Object.assign(Error(result.error||'D1 request failed'),{status:response.status});
  return result;
 };
 let workerAdminPrompt=null;
 const requestWorkerAdminPassword=async()=>{
  if(!workerAdminPrompt){
   workerAdminPrompt=Promise.resolve().then(()=>window.prompt('รหัส ADMIN_PASSWORD ของ Cloudflare Worker (ใช้จัดการเกม/การตั้งค่า):')).finally(()=>{workerAdminPrompt=null;});
  }
  return workerAdminPrompt;
 };
 class Builder{
  constructor(table,adminPassword){this.table=table;this.password=adminPassword;this.returning=false;this.op='select';this.columns='*';this.filters={};this.sort=[];this.max=1000;this.options={};this.val=null;this.sig=null;this.singleMode=0;}
  select(columns='*',options={}){this.columns=columns;this.options=options||{};if(this.op!=='select')this.returning=true;return this;}
  insert(data){this.op='insert';this.val=data;return this;}
  update(data){this.op='update';this.val=data;return this;}
  delete(){this.op='delete';return this;}
  upsert(data){this.op='upsert';this.val=data;return this;}
  eq(field,value){this.filters[field]={op:'eq',value};return this;}
  lt(field,value){this.filters[field]={op:'lt',value};return this;}
  like(field,value){this.filters[field]={op:'like',value};return this;}
  order(field,options={}){this.sort.push({field,ascending:options.ascending!==false});return this;}
  limit(value){this.max=Math.max(1,Math.min(20000,Number(value)||1000));return this;}
  abortSignal(signal){this.sig=signal;return this;}
  single(){this.singleMode=1;return this;}
  maybeSingle(){this.singleMode=2;return this;}
  async perform(){
   try{
    const endpoint='/v1/db/'+encodeURIComponent(this.table);
    const payload={operation:this.op,select:this.columns,filters:this.filters,order:this.sort,limit:this.max,options:this.options,values:this.val};
    let result;try{result=await call(endpoint,payload,this.password(),{signal:this.sig});}
    catch(e){if(e.status!==401||!this.password())throw e;const other=await requestWorkerAdminPassword();if(!other)throw e;window.GB_WORKER_ADMIN_PASSWORD=other;result=await call(endpoint,payload,other,{signal:this.sig});}
    let data=result.data;
    if(this.singleMode){
     if(Array.isArray(data)&&data.length===0&&this.singleMode===2)data=null;
     else if(Array.isArray(data)&&data.length===1)data=data[0];
     else if(Array.isArray(data)&&this.singleMode===1)throw Error('Expected exactly one row');
    }
    if(this.op!=='select'&&!this.singleMode&&!this.returning)data=null;
    return {data,error:null,count:result.count??null};
   }catch(error){return {data:null,error:{message:error.message,code:error.status===409?'409':String(error.status||'D1_ERROR')},count:null};}
  }
  then(yes,no){return this.perform().then(yes,no);}
 }
 function newPresence(){let data={},subscriber=()=>{},list=()=>{},token=crypto.randomUUID(),interval=null,current=null;
   const heartbeat=async(action='refresh')=>{
    if(!current&&action==='refresh')return;
    try{data=await call('/v1/presence',{action:action==='leave'?'leave':'track',token,name:current?.name||'',game:current?.game||''});list();}catch(e){console.warn('D1 presence unavailable',e.message);}
   };
   return {
    presenceState:()=>data,
    on(event,filter,cb){if(event==='presence')list=cb;return this;},
    subscribe(cb){subscriber=cb;queueMicrotask(()=>subscriber('SUBSCRIBED'));
      if(interval===null)interval=setInterval(()=>{if(document.visibilityState==='visible')void heartbeat();},30000);
      return this;
    },
    async track(meta){current=meta;await heartbeat('track');},
    async untrack(){if(interval!==null){clearInterval(interval);interval=null;}if(current){await heartbeat('leave');current=null;}},
    async unsubscribe(){await this.untrack();return 'ok';}
   };
 }
 function createClient(options={}){
  const originalPassword=typeof options.getAdminPassword==='function'?options.getAdminPassword:()=>'';
  const password=()=>originalPassword()?(window.GB_WORKER_ADMIN_PASSWORD||originalPassword()):'';
  return {
   from:table=>new Builder(table,password),
   channel:()=>newPresence(),
   removeChannel:channel=>channel?.unsubscribe?.()??Promise.resolve(),
   rpc:async()=>({error:{message:'Legacy RPC disabled. Use profile adapter.'}}),
   storage:{from:()=>({getPublicUrl:()=>({data:{publicUrl:''}}),upload:async()=>({error:{message:'Supabase Storage disabled in D1 mode'}}),remove:async()=>({error:{message:'Supabase Storage disabled in D1 mode'}})})}
  };
 }
 function createProfileClient(){
  const code=()=>String(localStorage.getItem('syncCode')||'').trim().toLowerCase();
  let token;try{token=sessionStorage.getItem('emu-profile-token')||''}catch{}
  if(!/^[0-9a-f-]{36}$/i.test(token)){token=crypto.randomUUID();sessionStorage.setItem('emu-profile-token',token);}
  let held='',inflight=null,lastLease=0;
  const action=(type,payload={},keepalive=false)=>call('/v1/profile',{action:type,code:payload.code??code(),token,...payload},'',{keepalive});
  async function claim(value){value=String(value||'').trim().toLowerCase();if(!value)return true;
    // Avoid one network lease request per favorite/quick-save access.
    // Refresh frequently enough to preserve the existing shared-code lease model.
    if(held===value&&Date.now()-lastLease<4000)return true;
    if(inflight){await inflight;if(held===value)return true;throw Error('กำลังตรวจรหัสซิงก์อื่นอยู่');}
    const job=(async()=>{const out=await action('lease',{code:value,release:false});if(!out?.ok){held='';throw Error('รหัสซิงก์นี้มีคนใช้งานอยู่');}held=value;lastLease=Date.now();return true;})();
    inflight=job;try{return await job}finally{inflight=null;}
  }
  async function select(value){value=String(value||'').trim().toLowerCase();if(value.length>128)throw Error('รหัสซิงก์ยาวเกิน 128 ตัวอักษร');
   const previous=code();await claim(value);localStorage.setItem('syncCode',value);
   if(previous&&previous!==value){if(held===previous){held='';lastLease=0;}void action('lease',{code:previous,release:true}).catch(()=>{});}
  }
  async function ensure(){const value=code();if(value)await claim(value);return value;}
  const favorites=async(game=null,on=null)=>{const value=await ensure();return value?await action('favorites',{game,on}):[];};
  const quick=async(game,record=null)=>{const value=await ensure();return value?await action('quick',{game:String(game),record}):null;};
  addEventListener('pagehide',()=>{if(held)void action('lease',{code:held,release:true},true).catch(()=>{});});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&code())void ensure().catch(()=>{});});
  return {select,ensure,favorites,quick,read:code};
 }
 window.GBD1=Object.freeze({enabled,workerUrl:endpoint,createClient,createProfileClient,catalogUrl:endpoint+'/v1/catalog'});
})();
