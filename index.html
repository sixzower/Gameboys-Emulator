  const frame=document.createElement('iframe');frame.id='local3DSFrame';frame.title='Nintendo 3DS';frame.allow='fullscreen; accelerometer; gyroscope';
  frame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483001;background:#181615';
  frame.onload=function(){try{const back=frame.contentDocument.getElementById('backBtn');if(back)back.onclick=function(event){event.preventDefault();frame.remove();window.__restoreShelfAfter3DS?.();};}catch{}};
  frame.srcdoc=getLocal3DSPage();document.body.appendChild(frame);
};

window.__openHosted3DS=function(url){
 const target=new URL(url,location.href);if(target.origin!==location.origin)throw new Error('3DS player must be same-origin');
 const existing=document.getElementById('hosted3DSFrame');if(existing)return;
 const frame=document.createElement('iframe');frame.id='hosted3DSFrame';frame.title='Nintendo 3DS';frame.allow='fullscreen; cross-origin-isolated; accelerometer; gyroscope';frame.allowFullscreen=true;frame.tabIndex=0;
 frame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483001;background:#181615';
 const update=function(){try{const child=frame.contentWindow;child?.syncFullscreenToolbar?.();child?.schedule3DSLayout?.();}catch{}};
 document.addEventListener('fullscreenchange',update);document.addEventListener('webkitfullscreenchange',update);
 frame.onload=function(){update();try{frame.focus();frame.contentWindow.focus();}catch{}};
 frame.__releaseFullscreenListeners=function(){document.removeEventListener('fullscreenchange',update);document.removeEventListener('webkitfullscreenchange',update);};
 frame.src=target.href;document.body.appendChild(frame);
 // Synchronous call during Play: no await, navigation, timer, or second gesture.
 if(window.matchMedia('(pointer: coarse)').matches && !(document.fullscreenElement||document.webkitFullscreenElement)){
  const request=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
  if(typeof request==='function')try{Promise.resolve(request.call(document.documentElement,{navigationUI:'hide'})).then(update).catch(error=>console.warn('3DS fullscreen unavailable',error));}catch(error){console.warn('3DS fullscreen unavailable',error);}
 }
};
window.__closeHosted3DS=async function(){
 const frame=document.getElementById('hosted3DSFrame');if(!frame)return;
 frame.__releaseFullscreenListeners?.();
 const full=document.fullscreenElement||document.webkitFullscreenElement;
 if(full&&(full===frame||full.contains(frame)))try{const exit=document.exitFullscreen||document.webkitExitFullscreen;await exit.call(document);}catch{}
 frame.remove();window.__restoreShelfAfter3DS?.();
