max=\"100\" aria-valuenow=\"0\">\n            \u003cspan class=\"boot-load-seg\">\u003c/span>\n            \u003cspan class=\"boot-load-seg\">\u003c/span>\n            \u003cspan class=\"boot-load-seg\">\u003c/span>\n            \u003cspan class=\"boot-load-seg\">\u003c/span>\n            \u003cspan class=\"boot-load-seg\">\u003c/span>\n            \u003cspan class=\"boot-load-seg\">\u003c/span>\n            \u003cspan class=\"boot-load-seg\">\u003c/span>\n            \u003cspan class=\"boot-load-seg\">\u003c/span>\n            \u003cspan class=\"boot-load-seg\">\u003c/span>\n            \u003cspan class=\"boot-load-seg\">\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"boot-load-pct\" id=\"gbBootPercent\">0%\u003c/div>\n          \u003cdiv class=\"gb-boot-message\" id=\"gbBootMessage\">\u0e01\u0e33\u0e25\u0e31\u0e07\u0e40\u0e15\u0e23\u0e35\u0e22\u0e21\u0e40\u0e01\u0e21...\u003c/div>\n          \u003cbutton type=\"button\" class=\"btn\" id=\"error-reload\" hidden>\u0e25\u0e2d\u0e07\u0e43\u0e2b\u0e21\u0e48\u003c/button>\n        \u003cdiv id=\"bootElapsed\" class=\"gb-boot-message\">\u003c/div>\u003cbutton type=\"button\" id=\"error-log\" hidden>\u0e14\u0e32\u0e27\u0e19\u0e4c\u0e42\u0e2b\u0e25\u0e14\u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01\u003c/button>\u003c/div>\n      \u003c/div>\u003c/div>\u003ccanvas id=\"canvas\" width=\"400\" height=\"480\" aria-label=\"\u0e08\u0e2d\u0e40\u0e01\u0e21\u0e2a\u0e2d\u0e07\u0e08\u0e2d \u0e41\u0e15\u0e30\u0e08\u0e2d\u0e25\u0e48\u0e32\u0e07\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e2a\u0e48\u0e07\u0e17\u0e31\u0e0a\">\u003c/canvas>\u003cdiv class=\"shoulders\">\u003cbutton data-control=\"L\">L\u003c/button>\u003cbutton data-control=\"R\">R\u003c/button>\u003c/div>\u003cdiv class=\"controls\">\u003cdiv>\u003cspan class=\"label\">CIRCLE PAD \u00b7 \u0e25\u0e39\u0e01\u0e28\u0e23\u003c/span>\u003cdiv class=\"dpad\">\u003cbutton class=\"up\" data-control=\"Up\">\u25b2\u003c/button>\u003cbutton class=\"left\" data-control=\"Left\">\u25c0\ ds-rom-worker.natlego007.workers.dev\" crossorigin>\n\u003clink rel=\"preconnect\" href=\"https://cdn.emulatorjs.org\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Press+Start+2P&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --bg:#f4f1e8; --card:#ffffff; --text:#2b2b2b; --sub:#6b6b6b;\n  --accent:#e3350d; --accent2:#3b4cca; --border:#ddd6c4; --shadow:rgba(0,0,0,.12);\n  --font-pixel:'Press Start 2P',monospace;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n:root[data-theme=\"dark\"]{ --bg:#181615; --card:#242120; --text:#f1ede4; --sub:#a89f92; --border:#3a352f; --shadow:rgba(0,0,0,.4);}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){ --bg:#181615; --card:#242120; --text:#f1ede4; --sub:#a89f92; --border:#3a352f; --shadow:rgba(0,0,0,.4);}\n}\n\nhtml{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}\n*{box-sizing:border-box;}\nbody{margin:0; min-height:100%; background:var(--bg); background-image:radial-gradient(circle at 1px 1px, rgba(127,127,127,.14) 1px, transparent 0); background-size:4px 4px; color:var(--text); font-family:'Prompt',-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; transition:color .25s ease;}\nheader{position:sticky; top:0; z-index:5; padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px; background:#2a2a2a; color:#e8e8e8; border-bottom:1px solid #3a3a3a; display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:48px;}\n.tl{display:flex; gap:7px; align-items:center;}\n.tl i{width:12px; height:12px; border-radius:50%; display:block;}\n.tl .r{background:#ff5f57;} .tl .y{background:#febc2e;} .tl .g{background:#28c840;}\nheader .brand{position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:6px; color:#e8e8e8; font-size:13px; font- imer=setTimeout(()=>loaderError('\u0e42\u0e2b\u0e25\u0e14 Emulator \u0e43\u0e0a\u0e49\u0e40\u0e27\u0e25\u0e32\u0e19\u0e32\u0e19\u0e40\u0e01\u0e34\u0e19\u0e44\u0e1b \u0e01\u0e23\u0e38\u0e13\u0e32\u0e01\u0e14\u0e25\u0e2d\u0e07\u0e2d\u0e35\u0e01\u0e04\u0e23\u0e31\u0e49\u0e07'),45000);\n  document.body.appendChild(s);\n}\n\n// ---------- intro 3D marquee (shared images, from Supabase) ----------\nconst DEFAULT_MARQUEE_IMAGES=[\n  'https://picsum.photos/seed/gba1/400/300','https://picsum.photos/seed/gba2/400/300',\n  'https://picsum.photos/seed/gba3/400/300','https://picsum.photos/seed/gba4/400/300',\n  'https://picsum.photos/seed/gba5/400/300','https://picsum.photos/seed/gba6/400/300',\n  'https://picsum.photos/seed/gba7/400/300','https://picsum.photos/seed/gba8/400/300',\n  'https://picsum.photos/seed/gba9/400/300','https://picsum.photos/seed/gba10/400/300',\n  'https://picsum.photos/seed/gba11/400/300','https://picsum.photos/seed/gba12/400/300'\n];\nlet MARQUEE_PASSWORD=''; // Admin credential kept in memory only after server verification.\nasync function fetchMarqueeRows(){\n  const {data,error}=await sb.from('marquee_images').select('*').order('sort_order',{ascending:true});\n  if(error){ console.error(error); return []; }\n  return data||[];\n}\nasync function buildIntroMarquee(){\n  const grid=document.getElementById('introGrid');\n  grid.innerHTML='';\n  grid.classList.remove('ready');\n  const rows=await fetchMarqueeRows();\n  const urls = [...(rows.length ? rows.map(r=>publicUrl(r.image_path)) : DEFAULT_MARQUEE_IMAGES)];\n  // random order on every page load (Fisher\u2013Yates) \u2014 only the display is shuffled; the saved sort_order in the admin panel is untouched\n  for(let i=urls.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [urls[i],urls[j]]=[urls[j],urls[i]]; }\n  const cols=[[],[],[]];\n  urls.forEach((src,i)=>cols[i%3].push(src));\n  const loadPromises=[];\n  cols.forEach((list,i)=>{\n    const col=document.createElement('div');\n    col.className='intro-col c'+(i+1);\n    // duplicate list so the loop feels continuous\n    [...list,...list].forEach(src=>{\n      const img=document.createElement('img'); img.crossOrigin='anonymous';img.loading='eager';img.decoding='async';\n      img.alt=''; img.draggable=false;\n      loadPromises.push(new Promise(resolve=>{ img.onload=resolve; img.onerror=resolve; }));\n      img.src=src;\n      col.appendChild(img);\n    });\n    grid.appendChild(col);\n  });\n  // Reveal the whole grid immediately; every image request starts together.\n  void Promise.all(loadPromises);\n  grid.classList.add('ready');\n}\n\n// ---------- shared audio context ----------\n// All three UI sounds below used to each create a brand-new AudioContext and then\n// close it when done. Spinning up a fresh context has real startup cost, which is\n// why every sound played with a noticeable delay. Worse, a context created outside\n// of a genuine click/tap (e.g. inside a \"mouseenter\" handler) starts life\n// *suspended* under the browser's autoplay policy, so it could play nothing at all \u2014\n// this is exactly why the hover chime went silent while dragging the mouse onto the\n// game popup. Fix: keep ONE context alive for the whole page and just resume() it\n// before each sound, so it only ever needs to \"start up\" once.\nlet sharedAudioCtx=null;\nfunction getAudioCtx(){\n  const AC=window.AudioContext||window.webkitAudioContext;\n  if(!AC) return null;\n  if(!sharedAudioCtx) sharedAudioCtx=new AC();\n  if(sharedAudioCtx.state==='suspended') sharedAudioCtx.resume().catch(()=>{});\n  return sharedAudioCtx;\n}\n// short retro \"power-on\" chime played on tap of the GAMEBOY EMULATOR title (generated with WebAudio, no audio file needed)\nfunction playDing(){\n  try{\n    const ctx=getAudioCtx();\n    if(!ctx) return;\n    const now=ctx.currentTime;\n    const notes=[[988,0],[1319,0.09]]; // two quick square-wave notes \u2014 a retro chiptune \"power on\" blip\n    notes.forEach(([freq,delay])=>{\n      const osc=ctx.createOscillator();\n      const gain=ctx.createGain();\n      osc.type='square';\n      osc.frequency.setValueAtTime(freq, now+delay);\n      gain.gain.setValueAtTime(0.0001, now+delay);\n      gain.gain.exponentialRampToValueAtTime(0.13, now+delay+0.012);\n      gain.gain.exponentialRampToValueAtTime(0.0001, now+delay+0.2);\n      osc.connect(gain); gain.connect(ctx.destination);\n      osc.start(now+delay);\n      osc.stop(now+delay+0.22);\n    });\n  }catch(e){ /* ignore \u2014 audio is a nice-to-have, never block navigation */ }\n}\n// soft click blip \u2014 used only for explicit button presses (e.g. the Play button), never on hover\nfunction playClick(){\n  try{\n    const ctx=getAudioCtx();\n    if(!ctx) return;\n    const osc=ctx.createOscillator();\n    const gain=ctx.createGain();\n    osc.type='triangle';\n    osc.frequency.setValueAtTime(720, ctx.currentTime);\n    gain.gain.setValueAtTime(0.0001, ctx.currentTime);\n    gain.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime+0.008);\n    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.11);\n    osc.connect(gain); gain.connect(ctx.destination);\n    osc.start();\n    osc.stop(ctx.currentTime+0.12);\n  }catch(e){ /* ignore audio errors */ }\n}\n// very soft hover chime \u2014 used for game popups: each library card and the game-detail popup\nfunction playHover(){\n  try{\n    const ctx=getAudioCtx();\n    if(!ctx) return;\n    const osc=ctx.createOscillator();\n    const gain=ctx.createGain();\n    osc.type='sine';\n    osc.frequency.setValueAtTime(1500, ctx.currentTime);\n    gain.gain.setValueAtTime(0.0001, ctx.currentTime);\n    gain.gain.exponentialRampToValueAtTime(0.05, ctx.currentTime+0.006);\n    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.09);\n    osc.connect(gain); gain.connect(ctx.destination);\n    osc.start();\n    osc.stop(ctx.currentTime+0.1);\n  }catch(e){ /* ignore audio errors */ }\n}\n// bouncy little \"pop\" \u2014 plays right as the game-detail popup bounces open (its card\n// click is also what unlocks the shared AudioContext in time for the hover chime below)\nfunction playPop(){\n  try{\n    const ctx=getAudioCtx();\n    if(!ctx) return;\n    const now=ctx.currentTime;\n    const osc=ctx.createOscillator();\n    const gain=ctx.createGain();\n    osc.type='sine';\n    osc.frequency.setValueAtTime(520, now);\n    osc.frequency.exponentialRampToValueAtTime(880, now+0.09);\n    gain.gain.setValueAtTime(0.0001, now);\n    gain.gain.exponentialRampToValueAtTime(0.12, now+0.02);\n    gain.gain.exponentialRampToValueAtTime(0.0001, now+0.16);\n    osc.connect(gain); gain.connect(ctx.destination);\n    osc.start(now);\n    osc.stop(now+0.17);\n  }catch(e){ /* ignore audio errors */ }\n}\n// short rising-pitch \"blip\" played each time a segment of the loading bar lights up\nfunction playLoadBlip(freq){\n  try{\n    const ctx=getAudioCtx();\n    if(!ctx) return;\n    const go=()=>{\n      const now=ctx.currentTime;\n      const osc=ctx.createOscillator();\n      const gain=ctx.createGain();\n      osc.type='square';\n      osc.frequency.setValueAtTime(freq, now);\n      gain.gain.setValueAtTime(0.0001, now);\n      gain.gain.exponentialRampToValueAtTime(0.07, now+0.008);\n      gain.gain.exponentialRampToValueAtTime(0.0001, now+0.07);\n      osc.connect(gain); gain.connect(ctx.destination);\n      osc.start(now); osc.stop(now+0.08);\n    };\n    if(ctx.state==='running') go(); // if still locked, stay silent (a blip after the unlock would sound wrong)\n  }catch(e){ /* ignore audio errors */ }\n}\nconst BOOT_LOAD_SEGMENTS=10;\n// fake 0-100% loading bar shown on a real fresh visit/refresh, purely cosmetic \u2014 it masks the brief\n// moment the page needs to set itself up and ends with a little chime, then reveals the intro splash.\nfunction runBootLoadingScreen(){\n  return new Promise(resolve=>{\n    const view=document.getElementById('bootLoadingView');\n    const track=document.getElementById('bootLoadTrack');\n    const pct=document.getElementById('bootLoadPct');\n    track.innerHTML='';\n    for(let i=0;i\u003cBOOT_LOAD_SEGMENTS;i++){ const seg=document.createElement('div'); seg.className='boot-load-seg'; track.appendChild(seg); }\n    const segs=[...track.children];\n    let filled=0, p=0;\n    // browsers keep audio locked until the visitor's first tap/click/key \u2014 unlock then, and hint if still locked\n    const hint=document.getElementById('bootLoadHint');\n    const unlock=()=>{ try{ const c=getAudioCtx(); if(c && c.state==='running' && hint) hint.classList.remove('show'); }catch(e){} };\n    ['pointerdown','touchstart','keydown'].forEach(ev=>window.addEventListener(ev, unlock, {passive:true}));\n    const timer=setInterval(()=>{\n      p=Math.min(100, p + 4 + Math.random()*10); // uneven steps so it doesn't look mechanically linear\n      const shouldFill=Math.floor(p/100*BOOT_LOAD_SEGMENTS);\n      while(filled\u003cshouldFill){\n        segs[filled].classList.add('on');\n        playLoadBlip(320+filled*34);\n        filled++;\n      }\n      pct.textContent=Math.floor(p)+'%';\n      if(p>=100){\n        clearInterval(timer);\n        try{ const c=getAudioCtx(); if(c && c.state==='running') playDing(); }catch(e){} // skip if audio is still locked, so it can't fire late\n        setTimeout(()=>{\n          view.classList.add('hide');\n          setTimeout(()=>{ view.style.display='none'; resolve(); }, 420);\n        }, 260);\n      }\n    }, 110);\n  });\n}\n// clicking the title zooms into the site, then reveals the library\nfunction enterFromIntro(){\n  const introEl=document.getElementById('introView');\n  if(introEl.classList.contains('zooming')) return;\n  introEl.classList.add('zooming');\n  setTimeout(()=>{ introEl.style.display='none'; }, 560);\n}\ndocument.getElementById('introTitle').addEventListener('click',(e)=>{\n  e.stopPropagation();\n  playDing();\n  enterFromIntro();\n});\n// hover sound for the GAMEBOY EMULATOR title \u2014 plays the moment the colour starts changing, no click needed.\n// Browsers keep audio locked until the visitor has interacted with the page at least once (tap/click/key),\n// so we unlock the shared AudioContext on the very first interaction anywhere on the page.\nfunction playTitleHover(){\n  try{\n    const ctx=getAudioCtx();\n    if(!ctx) return;\n    const go=()=>{\n      const now=ctx.currentTime;\n      [[880,0],[1320,0.07]].forEach(([freq,delay])=>{\n        const osc=ctx.createOscillator();\n        const gain=ctx.createGain();\n        osc.type='triangle';\n        osc.frequency.setValueAtTime(freq, now+delay);\n        gain.gain.setValueAtTime(0.0001, now+delay);\n        gain.gain.exponentialRampToValueAtTime(0.09, now+delay+0.01);\n        gain.gain.exponentialRampToValueAtTime(0.0001, now+delay+0.14);\n        osc.connect(gain); gain.connect(ctx.destination);\n        osc.start(now+delay);\n        osc.stop(now+delay+0.16);\n      });\n    };\n    if(ctx.state==='running') go();\n    else ctx.resume().then(()=>{ if(ctx.state==='running') go(); }).catch(()=>{});\n  }catch(e){ /* ignore audio errors */ }\n}\n['pointerdown','touchstart','keydown'].forEach(evt=>{\n  window.addEventListener(evt, ()=>{ getAudioCtx(); }, {once:true, passive:true});\n});\ndocument.getElementById('introTitle').addEventListener('mouseenter', playTitleHover);\n\n// short ascending chime for the Game Boy-style boot animation when entering a game\nfunction playGbBootChime(){\n  try{\n    const ctx=getAudioCtx();\n    if(!ctx) return;\n    const go=()=>{\n      const now=ctx.currentTime;\n      [[659.25,0],[830.61,0.09],[987.77,0.18]].forEach(([freq,delay])=>{\n        const osc=ctx.createOscillator();\n        const gain=ctx.createGain();\n        osc.type='square';\n        osc.frequency.setValueAtTime(freq, now+delay);\n        gain.gain.setValueAtTime(0.0001, now+delay);\n        gain.gain.exponentialRampToValueAtTime(0.08, now+delay+0.015);\n        gain.gain.exponentialRampToValueAtTime(0.0001, now+delay+0.22);\n        osc.connect(gain); gain.connect(ctx.destination);\n        osc.start(now+delay);\n        osc.stop(now+delay+0.24);\n      });\n    };\n    if(ctx.state==='running') go();\n    else ctx.resume().then(()=>{ if(ctx.state==='running') go(); }).catch(()=>{});\n  }catch(e){ /* ignore audio errors */ }\n}\n\n// ---------- key button: password gate for editing the shared library (games + marquee images) ----------\nconst keyModalBg=document.getElementById('keyModalBg');\nconst imgModalBg=document.getElementById('imgModalBg');\nconst keyPassInput=document.getElementById('keyPassInput');\nconst keyRememberChk=document.getElementById('keyRememberChk');\nconst keyErrorMsg=document.getElementById('keyErrorMsg');\nconst KEY_PASS_STORAGE='gbeAdminPassSaved';\nconst marqueeThumbsEl=document.getElementById('marqueeThumbs');\nlet marqueeAuthorized=false; // in-memory only \u2014 always cleared on page refresh, so the password must be entered again every time\nlet stagedImages=[]; // rows {id, image_path, sort_order} currently shown in the editor\nlet pendingAuthAction=null;\n\nfunction requireAuth(action){\n  if(marqueeAuthorized){ action(); return; }\n  pendingAuthAction=action;\n  keyErrorMsg.textContent='';\n  const saved=localStorage.getItem(KEY_PASS_STORAGE);\n  keyPassInput.value=saved||'';\n  keyRememberChk.checked=true;\n  keyModalBg.classList.add('show');\n  setTimeout(()=>keyPassInput.focus(),50);\n}\ndocument.getElementById('keyCancelBtn').onclick=()=>{ keyModalBg.classList.remove('show'); pendingAuthAction=null; };\nlet adminLoginBusy=false;\ndocument.getElementById('keySubmitBtn').onclick=async()=>{\n  if(adminLoginBusy)return;\n  const password=keyPassInput.value;\n  const button=document.getElementById('keySubmitBtn');\n  adminLoginBusy=true; button.disabled=true;\n  try{\n    const {data,error}=await sb.rpc('verify_emulator_admin',{p_password:password});\n    if(error){\n      if(error.code==='PGRST202')throw m.title='\u0e25\u0e1a\u0e23\u0e39\u0e1b\u0e19\u0e35\u0e49';\n    rm.onclick=async()=>{\n      rm.disabled=true;\n      try{\n        await sb.from('marquee_images').delete().eq('id', row.id);\n        await deleteFromLibrary(row.image_path);\n        stagedImages=stagedImages.filter(r=>r.id!==row.id);\n        renderThumbs();\n      }catch(err){ alert('\u0e25\u0e1a\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08: '+(err.message||err)); rm.disabled=false; }\n    };\n    cell.addEventListener('dragstart',(e)=>{\n      cell.classList.add('dragging');\n      e.dataTransfer.effectAllowed='move';\n      e.dataTransfer.setData('text/plain', String(idx));\n    });\n    cell.addEventListener('dragend',()=> cell.classList.remove('dragging'));\n    cell.addEventListener('dragover',(e)=>{ e.preventDefault(); cell.classList.add('drag-over'); });\n    cell.addEventListener('dragleave',()=> cell.classList.remove('drag-over'));\n    cell.addEventListener('drop', async (e)=>{\n      e.preventDefault();\n      cell.classList.remove('drag-over');\n      const fromIdx=parseInt(e.dataTransfer.getData('text/plain'),10);\n      const toIdx=Number(cell.dataset.idx);\n      if(Number.isNaN(fromIdx) || fromIdx===toIdx) return;\n      const [moved]=stagedImages.splice(fromIdx,1);\n      stagedImages.splice(toIdx,0,moved);\n      renderThumbs();\n      await persistThumbOrder();\n    });\n    cell.appendChild(img); cell.appendChild(rm);\n    marqueeThumbsEl.appendChild(cell);\n  });\n}\nasync function persistThumbOrder(){\n  try{\n    await Promise.all(stagedImages.map((row,i)=>{\n      row.sort_order=i;\n      return sb.from('marquee_images').update({sort_order:i}).eq('id', row.id);\n    }));\n  }catch(err){ console.warn('save new order failed', err); }\n}\nfunction resizeImageFileToBlob(file,maxW=900,quality=0.82){\n  return new Promise((resolve,reject)=>{\n    const reader=new FileReader();\n    reader.onload=(e)=>{\n      const img=new Image(); img.crossOrigin='anonymous';\n      img tory=storyTa.value.trim();\n      if(newStory!==(rawStory||'').trim()){\n        await setSiteSetting(SUMMARY_KEY_PREFIX+item.id, newStory);\n        summaryOverrides[String(item.id)]=newStory;\n      }\n      toastMsg('\u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01\u0e2a\u0e23\u0e38\u0e1b\u0e40\u0e01\u0e21\u0e41\u0e25\u0e49\u0e27'); refresh();\n    }catch(err){\n      console.error(err); alert('\u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08: '+(err.message||err));\n      save.disabled=false; save.textContent='\u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01';\n    }\n  };\n  storyTa.focus();\n}\nconst SUMMARY_SYSTEMS=[['gb','Game Boy (GB)'],['gbc','Game Boy Color (GBC)'],['gba','Game Boy Advance (GBA)'],['nds','Nintendo DS (NDS)']];\nfunction renderSummaryList(){\n  const q=summarySearchEl.value.trim().toLowerCase();\n  const list=summaryGames.filter(g=>!q || (g.name||'').toLowerCase().includes(q) || (g.description||'').toLowerCase().includes(q));\n  summaryListEl.innerHTML='';\n  summaryCountEl.textContent = q ? `\u0e1e\u0e1a ${list.length} \u0e08\u0e32\u0e01\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14 ${summaryGames.length} \u0e40\u0e01\u0e21` : `\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14 ${summaryGames.length} \u0e40\u0e01\u0e21 \u2014 \u0e41\u0e15\u0e30\u0e17\u0e35\u0e48\u0e40\u0e01\u0e21\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e14\u0e39\u0e23\u0e32\u0e22\u0e25\u0e30\u0e40\u0e2d\u0e35\u0e22\u0e14\u0e41\u0e25\u0e30\u0e40\u0e25\u0e48\u0e19`;\n  if(!list.length){\n    const e=document.createElement('div'); e.className='empty'; e.style.padding='30px 10px';\n    e.textContent = summaryGames.length ? '\u0e44\u0e21\u0e48\u0e1e\u0e1a\u0e40\u0e01\u0e21\u0e17\u0e35\u0e48\u0e04\u0e49\u0e19\u0e2b\u0e32' : '\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e21\u0e35\u0e40\u0e01\u0e21\u0e43\u0e19\u0e04\u0e25\u0e31\u0e07';\n    summaryListEl.appendChild(e); return;\n  }\n  const known=SUMMARY_SYSTEMS.map(x=>x[0]);\n  const groups=[...SUMMARY_SYSTEMS, ...[...new Set(list.map( const fallbackStory = `\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e40\u0e01\u0e21: ${item.name||'\u0e40\u0e01\u0e21\u0e19\u0e35\u0e49'} (${String(item.core||'').toUpperCase()})\\n\\n\u0e04\u0e33\u0e2d\u0e18\u0e34\u0e1a\u0e32\u0e22\u0e08\u0e32\u0e01\u0e04\u0e25\u0e31\u0e07\u0e40\u0e01\u0e21: ${item.description||'\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e21\u0e35\u0e04\u0e33\u0e2d\u0e18\u0e34\u0e1a\u0e32\u0e22\u0e08\u0e32\u0e01\u0e1c\u0e39\u0e49\u0e14\u0e39\u0e41\u0e25'}\\n\\n\u0e23\u0e32\u0e22\u0e25\u0e30\u0e40\u0e2d\u0e35\u0e22\u0e14\u0e40\u0e1e\u0e34\u0e48\u0e21\u0e40\u0e15\u0e34\u0e21: \u0e40\u0e01\u0e21\u0e19\u0e35\u0e49\u0e40\u0e1b\u0e34\u0e14\u0e1c\u0e48\u0e32\u0e19\u0e2d\u0e35\u0e21\u0e39\u0e40\u0e25\u0e40\u0e15\u0e2d\u0e23\u0e4c\u0e02\u0e2d\u0e07\u0e23\u0e30\u0e1a\u0e1a ${String(item.core||'').toUpperCase()} \u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e40\u0e19\u0e37\u0e49\u0e2d\u0e40\u0e23\u0e37\u0e48\u0e2d\u0e07 \u0e20\u0e39\u0e21\u0e34\u0e20\u0e32\u0e04 \u0e15\u0e31\u0e27\u0e25\u0e30\u0e04\u0e23 \u0e23\u0e30\u0e1a\u0e1a\u0e01\u0e32\u0e23\u0e40\u0e25\u0e48\u0e19 \u0e41\u0e25\u0e30\u0e40\u0e19\u0e37\u0e49\u0e2d\u0e2b\u0e32\u0e2b\u0e25\u0e31\u0e07\u0e08\u0e1a\u0e40\u0e01\u0e21\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e21\u0e35\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e43\u0e19\u0e04\u0e25\u0e31\u0e07 \u0e08\u0e36\u0e07\u0e44\u0e21\u0e48\u0e23\u0e30\u0e1a\u0e38\u0e23\u0e32\u0e22\u0e25\u0e30\u0e40\u0e2d\u0e35\u0e22\u0e14\u0e17\u0e35\u0e48\u0e2d\u0e32\u0e08\u0e04\u0e25\u0e32\u0e14\u0e40\u0e04\u0e25\u0e37\u0e48\u0e2d\u0e19`;\n      const rawStory = hasOv ? ovRaw : (bs ? bs.text : fallbackStory);\n      const storyText = hasOv ? ovRaw : (bs ? bs.text + (bs.full ? '' : '\\n\\n(\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e2a\u0e48\u0e27\u0e19\u0e19\u0e35\u0e49\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e04\u0e23\u0e1a)') : fallbackStory);\n      if(storyText){\n        const tg=document.createElement('button'); tg.type='button';\n        tg.style.cssText='margin-top:6px; border:1px solid var(--accent); color:var(--accent); background:transparent; border-radius:20px; padding:3px 10px; font-size:12px; cursor:pointer;';\n        tg.textContent='\u0e2d\u0e48\u0e32\u0e19\u0e23\u0e32\u0e22\u0e25\u0e30\u0e40\u0e2d\u0e35\u0e22\u0e14\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25';\n        const body=document.createElement('div'); body.className='s-desc'; body.style.cssText='display:none; margin-top:8px;';\n        body.textContent=storyText;\n        tg.onclick=(e)=>{ e.stopPropagation(); const open=body.style.display==='none'; body.style.display=open?'block':'none'; tg.textContent=open?'\u0e0b\u0e48\u0e2d\u0e19\u0e23\u0e32\u0e22\u0e25\u0e30\u0e40\u0e2d\u0e35\u0e22\u0e14':'\u0e2d\u0e48\u0e32\u0e19\u0e23\u0e32\u0e22\u0e25\u0e30\u0e40\u0e2d\u0e35\u0e22\u0e14\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25'; };\n        body.onclick=(e)=>e.stopPropagation();\n        box.appendChild(tg); box.appendChild(body);\n      }\n      if(marqueeAuthorized){\n        const ed=document.createElement('button'); ed.type='button';\n        ed.style.cssText='margin:6px 0 0 6px; border:1px solid var(--border); color:var(--text); background:transparent; border-radius:20px; padding:3px 10px; font-size:12px; cursor:pointer;';\n        ed.textContent='\u270e \u0e41\u0e01\u0e49\u0e44\u0e02\u0e2a\u0e23\u0e38\u0e1b';\n        ed.onclick=(e)=>{ e.stopPropagation(); openSummaryEditor(item, box, rawStory, hasOv); };\n        box.appendChild(ed);\n      }\n      row.appendChild(img); row.appendChild(box);\n      row.onclick=()=>{ summaryModalBg.classList.remove('show'); openDetailModal(item); };\n      summaryListEl.appendChild(row);\n    });\n  });\n}\nasync function openSummary(){\n  document.getElementById('scanGameInfoBtn').hidden=!marqueeAuthorized;\n  summarySearchEl.value='';\n  summaryModalBg.classList.add('show');\n  summaryCountEl.textContent='\u0e01\u0e33\u0e25\u0e31\u0e07\u0e42\u0e2b\u0e25\u0e14...';\n  summaryListEl.innerHTML='';\n  summaryGames = (typeof currentGames!=='undefined' && currentGames.length) ? currentGames : await fetchGames();\n  await loadSummaryOverrides();\n  renderSummaryList();\n}\ndocument.getElementById('summaryBtn').addEventListener('click', ()=>{ try{ playClick(); }catch(e){} openSummary(); });\nsummarySearchEl.addEventListener('input', renderSummaryList);\ndocument.getElementById('summaryCloseBtn').onclick=()=>summaryModalBg.classList.remove('show');\nsummaryModalBg.addEventListener('click',(e)=>{ if(e.target===summaryModalBg) summaryModalBg.classList.remove('show'); });\n\n// ---------- player dashboard (admin only): aggregated from play_sessions, keyed by each visitor's own sync code ----------\nconst dashboardModalBg=document.getElementById('dashboardModalBg');\nconst dashSummaryEl=document.getElementById('dashSummary');\nconst dashTopGamesEl=document.getElementById('dashTopGames');\nconst dashUsersEl=document.getElementById('dashUsers');\nlet dashRows=[];\nfunction escapeHtml(str){ const d=document.createElement('div'); d.textContent=str==null?'':str; return d.innerHTML; }\nfunction fmtDuration(sec){\n  sec=Math.max(0,Math.round(sec));\n  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);\n  if(h\u003c=0 && m\u003c=0) return sec+' \u0e27\u0e34';\n  if(h\u003c=0) return m+' \u0e19\u0e32\u0e17\u0e35';\n  return h+' \u0e0a\u0e21 '+m+' \u0e19\u0e32\u0e17\u0e35';\n}\nfunction fmtWhen(iso){\n  try{ return new Date(iso).toLocaleString('th-TH',{dateStyle:'medium', timeStyle:'short'}); }catch(e){ return iso||''; }\n}\nfunction cssVar(name){ return getComputedStyle(document.body||document.documentElement).getPropertyValue(name).trim(); }\nlet dashDailyChart=null, dashGamesChart=null;\nfunction renderDashCharts(){\n  if(typeof Chart==='undefined') return; // Chart.js failed to load (e.g. offline) \u2014 the text lists below still work fine\n  const accent=cssVar('--accent')||'#e3350d';\n  const textColor=cssVar('--text')||'#333';\n  const subColor=cssVar('--sub')||'#888';\n  const gridColor=cssVar('--border')||'#ddd';\n  // --- daily playtime, last 14 days (minutes) ---\n  const days=[]; const dayKeys=[];\n  for(let i=13;i>=0;i--){\n    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);\n    dayKeys.push(d.toISOString().slice(0,10));\n    days.push(d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}));\n  }\n  const dayMinutes=dayKeys.map(k=>0);\n  dashRows.forEach(r=>{\n    if(!r.ended_at) return;\n    const k=String(r.ended_at).slice(0,10);\n    const idx=dayKeys.indexOf(k);\n    if(idx>=0) dayMinutes[idx]+=(r.seconds||0)/60;\n  });\n  const dailyCtx=document.getElementById('dashDailyChart');\n  if(dashDailyChart) dashDailyChart.destroy();\n  if(dailyCtx){\n    dashDailyChart=new Chart(dailyCtx,{\n      type:'line',\n      data:{ labels:days, datasets:[{ label:'\u0e19\u0e32\u0e17\u0e35\u0e17\u0e35\u0e48\u0e40\u0e25\u0e48\u0e19', data:dayMinutes.map(m=>Math.round(m*10)/10), borderColor:accent, backgroundColor:accent+'33', fill:true, tension:.3, pointRadius:2 }] },\n      options:{ responsive:true, maintainAspectRatio:false,\n        plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>c.parsed.y+' \u0e19\u0e32\u0e17\u0e35'}} },\n        scales:{ x:{ ticks:{color:subColor,font:{size:10}}, grid:{color:gridColor} },\n                 y:{ beginAtZero:true, ticks:{color:subColor,font:{size:10}}, grid:{color:gridColor} } } }\n    });\n  }\n  // --- top games bar chart (minutes), matches the \"\u0e40\u0e01\u0e21\u0e22\u0e2d\u0e14\u0e19\u0e34\u0e22\u0e21\" list below ---\n  const gameTotalsForChart=new Map();\n  dashRows.forEach(r=>{\n    const gname=r.game_name||'(\u0e44\u0e21\u0e48\u0e17\u0e23\u0e32\u0e1a\u0e0a\u0e37\u0e48\u0e2d\u0e40\u0e01\u0e21)';\n    gameTotalsForChart.set(gname,(gameTotalsForChart.get(gname)||0)+(r.seconds||0));\n  });\n  const topForChart=[...gameTotalsForChart.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);\n  const gamesCtx=document.getElementById('dashGamesChart');\n  if(dashGamesChart) dashGamesChart.destroy sers=[...users.keys()].filter(k=>k!=='(\u0e44\u0e21\u0e48\u0e23\u0e30\u0e1a\u0e38\u0e23\u0e2b\u0e31\u0e2a\u0e0b\u0e34\u0e07\u0e01\u0e4c)').length;\n  const topGameName = gameTotals.size ? [...gameTotals.entries()].sort((a,b)=>b[1].seconds-a[1].seconds)[0][0] : '-';\n  [['\u0e1c\u0e39\u0e49\u0e40\u0e25\u0e48\u0e19\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14 (\u0e15\u0e32\u0e21\u0e23\u0e2b\u0e31\u0e2a\u0e0b\u0e34\u0e07\u0e01\u0e4c)', namedUsers],\n   ['\u0e40\u0e0b\u0e2a\u0e0a\u0e31\u0e19\u0e17\u0e35\u0e48\u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01\u0e44\u0e14\u0e49', totalSessions],\n   ['\u0e40\u0e27\u0e25\u0e32\u0e40\u0e25\u0e48\u0e19\u0e23\u0e27\u0e21\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14', fmtDuration(totalSeconds)],\n   ['\u0e40\u0e01\u0e21\u0e22\u0e2d\u0e14\u0e19\u0e34\u0e22\u0e21', topGameName]\n  ].forEach(([l,n])=>{\n    const c=document.createElement('div'); c.className='dash-card';\n    c.innerHTML='\u003cdiv class=\"n\">'+escapeHtml(n)+'\u003c/div>\u003cdiv class=\"l\">'+l+'\u003c/div>';\n    dashSummaryEl.appendChild(c);\n  });\n  dashTopGamesEl.innerHTML='';\n  const topGames=[...gameTotals.entries()].sort((a,b)=>b[1].seconds-a[1].seconds).slice(0,15);\n  if(!topGames.length){ dashTopGamesEl.innerHTML='\u003cdiv class=\"dash-empty\">\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e21\u0e35\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e01\u0e32\u0e23\u0e40\u0e25\u0e48\u0e19\u003c/div>'; }\n  topGames.forEach(([name,g])=>{\n    const row=document.createElement('div'); row.className='dash-game-row';\n    row.innerHTML='\u003cspan class=\"g-name\">'+escapeHtml(name)+'\u003c/span>\u003cspan class=\"g-meta\">'+fmtDuration(g.seconds)+' \u00b7 '+g.sessions+' \u0e04\u0e23\u0e31\u0e49\u0e07\u003c/span>';\n    dashTopGamesEl.appendChild(row);\n  });\n  dashUsersEl.innerHTML='';\n  let userList=[...users.entries()].sort((a,b)=>b[1].seconds-a[1].seconds);\n  if(!userList.length){ dashUsersEl.innerHTML='\u003cdiv class=\"dash-empty\">\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e21\u0e35\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e1c\u0e39\u0e49\u0e40\u0e25\u0e48\u0e19\u003c/div>'; return; }\n  userList.forEach(([code,u],idx)=>{\n    const wrap=document.createElement('div'); wrap.className='dash-user';\n    const head=document.createElement('div'); head.className='dash-user-head';\n    head.innerHTML='\u003cspan class=\"u-code\">'+escapeHtml(code)+'\u003c/span>'+\n      '\u003cspan class=\"u-meta\">'+fmtDuration(u.seconds)+' \u00b7 '+u.sessions+' \u0e40\u0e0b\u0e2a\u0e0a\u0e31\u0e19\u003cbr>\u0e40\u0e25\u0e48\u0e19\u0e25\u0e48\u0e32\u0e2a\u0e38\u0e14 '+(u.lastAt?fmtWhen(u.lastAt):'-')+' '+\n      '\u003csvg class=\"dash-chev\" width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\">\u003cpolyline points=\"6 9 12 15 18 9\"/>\u003c/svg>\u003c/span>';\n    const body=document.createElement('div'); body.className='dash-user-body';\n    [...u.games.entries()].sort((a,b)=>b[1].seconds-a[1].seconds).forEach(([gname,g])=>{\n      const r=document.createElement('div'); r.className='dash-game-row';\n      r.innerHTML='\u003cspan class=\"g-name\">'+escapeHtml(gname)+'\u003c/span>\u003cspan class=\"g-meta\">'+fmtDuration(g.seconds)+' \u00b7 '+g.sessions+' \u0e04\u0e23\u0e31\u0e49\u0e07\u003c/span>';\n      body.appendChild(r);\n    });\n    head.onclick=()=>wrap.classList.toggle('open');\n    wrap.appendChild(head); wrap.appendChild(body);\n    dashUsersEl.appendChild(wrap);\n  });\n}\nasync function cleanupOldSessions(){\n  // opportunistic housekeeping: drop sessions older than ~18 months so the table doesn't grow forever.\n  // Runs quietly in the background whenever the dashboard is opened \u2014 not urgent for a small group, just tidy.\n  try{\n    const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-18);\n    await sb.from('play_sessions').delete().lt('ended_at', cutoff.toISOString());\n  }catch(e){ console.warn('cleanupOldSessions failed', e); }\n}\nasync function openDashboard(){\n  dashboardModalBg.classList.add('show');\n  dashSummaryEl.innerHTML=''; dashTopGamesEl.innerHTML='';\n  dashUsersEl.innerHTML='\u003cdiv class=\"dash-empty\">\u0e01\u0e33\u0e25\u0e31\u0e07\u0e42\u0e2b\u0e25\u0e14...\u003c/div>';\n  cleanupOldSessions();\n  renderStorageUsage();\n  try{\n    const {data,error}=await sb.from('play_sessions').select('sync_code,game_id,game_name,seconds,ended_at').order('ended_at',{ascending:false}).limit(20000);\n    if(error){ dashUsersEl.innerHTML='\u003cdiv class=\"dash-empty\">\u0e42\u0e2b\u0e25\u0e14\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08: '+escapeHtml(error.message)+'\u003cbr>(\u0e19\u0e48\u0e32\u0e08\u0e30\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e44\u0e14\u0e49\u0e2a\u0e23\u0e49\u0e32\u0e07\u0e15\u0e32\u0e23\u0e32\u0e07 play_sessions \u0e43\u0e19 Supabase)\u003c/div>'; return; }\n    dashRows=data||[];\n  }catch(e){ dashUsersEl.innerHTML='\u003cdiv class=\"dash-empty\">\u0e42\u0e2b\u0e25\u0e14\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08\u003c/div>'; return; }\n  renderDashCharts();\n  renderDashboard();\n}\nconst storageSizeCache=new Map();\nfunction storageDecimal(n){return (n/1e9).toFixed(3)+' GB';}\nasync function storageRomSize(g){\n const cached=storageSizeCache.get(g.rom_path);if(cached&&Date.now()-cached.at\u003c300000)return cached.size;\n const head=await fetch(romUrlFor(g.rom_path),{method:'HEAD',signal:AbortSignal.timeout(30000)});\n const size=Number(head.headers.get('Content-Length'));\n if(!head.ok||!Number.isSafeInteger(size)||size\u003c1)throw Error('\u0e15\u0e23\u0e27\u0e08\u0e02\u0e19\u0e32\u0e14\u0e40\u0e01\u0e21 '+g.name+' \u0e44\u0e21\u0e48\u0e44\u0e14\u0e49');\n storageSizeCache.set(g.rom_path,{size,at:Date.now()});return size;\n}\n// Exact meet-in-the-middle subset search: every file remains whole.\nfunction bestStorageSubset(items,capacity){\n if(items.length>40)throw Error('\u0e21\u0e35\u0e44\u0e1f\u0e25\u0e4c\u0e40\u0e01\u0e34\u0e19 40 43\u0e19\u0e17\u0e38\u0e01\u0e20\u0e39\u0e21\u0e34\u0e20\u0e32\u0e04\\n\u0e40\u0e0a\u0e48\u0e19\u0e40\u0e14\u0e35\u0e22\u0e27\u0e01\u0e31\u0e1a\u0e20\u0e32\u0e04\u0e01\u0e48\u0e2d\u0e19\u0e2b\u0e19\u0e49\u0e32 \u0e41\u0e15\u0e48\u0e25\u0e30\u0e40\u0e01\u0e21\u0e40\u0e1b\u0e47\u0e19\u0e01\u0e32\u0e23\u0e40\u0e14\u0e34\u0e19\u0e17\u0e32\u0e07\u0e02\u0e2d\u0e07\u0e42\u0e1b\u0e40\u0e01\u0e21\u0e2d\u0e19\u0e40\u0e17\u0e23\u0e19\u0e40\u0e19\u0e2d\u0e23\u0e4c\u0e2b\u0e19\u0e38\u0e48\u0e21\u0e2a\u0e32\u0e27 (\u0e41\u0e25\u0e30\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e19 \u0e46 \u0e02\u0e2d\u0e07\u0e40\u0e17\u0e23\u0e19\u0e40\u0e19\u0e2d\u0e23\u0e4c) \u0e02\u0e13\u0e30\u0e17\u0e35\u0e48\u0e1e\u0e27\u0e01\u0e40\u0e02\u0e32\u0e04\u0e2d\u0e22\u0e1d\u0e36\u0e01\u0e1d\u0e19\u0e42\u0e1b\u0e40\u0e01\u0e21\u0e2d\u0e19\u0e44\u0e1b\u0e14\u0e49\u0e27\u0e22 \u0e04\u0e23\u0e31\u0e49\u0e07\u0e19\u0e35\u0e49 \u0e40\u0e19\u0e37\u0e49\u0e2d\u0e40\u0e23\u0e37\u0e48\u0e2d\u0e07\u0e40\u0e01\u0e34\u0e14\u0e02\u0e36\u0e49\u0e19\u0e17\u0e35\u0e48\u0e20\u0e39\u0e21\u0e34\u0e20\u0e32\u0e04\u0e04\u0e32\u0e25\u0e2d\u0e2a \u0e22\u0e36\u0e14\u0e15\u0e32\u0e21\u0e17\u0e32\u0e07\u0e15\u0e2d\u0e19\u0e40\u0e2b\u0e19\u0e37\u0e2d\u0e02\u0e2d\u0e07\u0e1b\u0e23\u0e30\u0e40\u0e17\u0e28\u0e1d\u0e23\u0e31\u0e48\u0e07\u0e40\u0e28\u0e2a \u0e42\u0e14\u0e22\u0e27\u0e31\u0e15\u0e16\u0e38\u0e1b\u0e23\u0e30\u0e2a\u0e07\u0e04\u0e4c\u0e02\u0e2d\u0e07\u0e40\u0e01\u0e21\u0e04\u0e37\u0e2d\u0e01\u0e33\u0e08\u0e31\u0e14\u0e2d\u0e07\u0e04\u0e4c\u0e01\u0e23\u0e2d\u0e32\u0e0a\u0e0d\u0e32\u0e01\u0e23\u0e23\u0e21\u0e0a\u0e37\u0e48\u0e2d \u0e17\u0e35\u0e21\u0e41\u0e1f\u0e25\u0e23\u0e4c (Team Flare) \u0e02\u0e13\u0e30\u0e17\u0e35\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e1e\u0e22\u0e32\u0e22\u0e32\u0e21\u0e40\u0e02\u0e49\u0e32\u0e41\u0e02\u0e48\u0e07\u0e02\u0e31\u0e19\u0e42\u0e1b\u0e40\u0e01\u0e21\u0e2d\u0e19\u0e25\u0e35\u0e01\u0e41\u0e0a\u0e21\u0e40\u0e1b\u0e35\u0e22\u0e19 (Pok\u00e9mon League Champion) \u0e14\u0e49\u0e27\u0e22 \u0e20\u0e32\u0e04\u0e40\u0e2d\u0e01\u0e0b\u0e4c\u0e41\u0e25\u0e30\u0e27\u0e32\u0e22\u0e19\u0e33\u0e40\u0e2a\u0e19\u0e2d\u0e42\u0e1b\u0e40\u0e01\u0e21\u0e2d\u0e19\u0e2a\u0e32\u0e22\u0e1e\u0e31\u0e19\u0e18\u0e38\u0e4c\u0e43\u0e2b\u0e21\u0e48 72 \u0e0a\u0e19\u0e34\u0e14 \u0e41\u0e25\u0e30\u0e21\u0e35\u0e04\u0e38\u0e13\u0e2a\u0e21\u0e1a\u0e31\u0e15\u0e34\u0e43\u0e2b\u0e21\u0e48 \u0e40\u0e0a\u0e48\u0e19 \u0e23\u0e39\u0e1b\u0e41\u0e1a\u0e1a\u0e20\u0e39\u0e15\u0e34 (Fairy) \u0e01\u0e32\u0e23\u0e41\u0e15\u0e48\u0e07\u0e15\u0e31\u0e27\u0e15\u0e31\u0e27\u0e25\u0e30\u0e04\u0e23 \u0e23\u0e30\u0e1a\u0e1a\u0e01\u0e32\u0e23\u0e15\u0e48\u0e2d\u0e2a\u0e39\u0e49\u0e41\u0e25\u0e30\u0e01\u0e25\u0e44\u0e01\u0e01\u0e32\u0e23\u0e1d\u0e36\u0e01\u0e1d\u0e19\u0e17\u0e35\u0e48\u0e1b\u0e23\u0e31\u0e1a\u0e43\u0e2b\u0e21\u0e48 \u0e41\u0e25\u0e30\u0e01\u0e23\u0e32\u0e1f\u0e34\u0e01 3 \u0e21\u0e34\u0e15\u0e34\u0e2b\u0e25\u0e32\u0e22\u0e40\u0e2b\u0e25\u0e35\u0e48\u0e22\u0e21\u0e17\u0e35\u0e48\u0e41\u0e01\u0e49\u0e44\u0e02\u0e43\u0e2b\u0e21\u0e48\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14 (\u0e41\u0e17\u0e19\u0e17\u0e35\u0e48\u0e2a\u0e44\u0e1b\u0e23\u0e15\u0e4c\u0e17\u0e35\u0e48\u0e43\u0e0a\u0e49\u0e43\u0e19\u0e40\u0e08\u0e19\u0e40\u0e19\u0e2d\u0e40\u0e23\u0e0a\u0e31\u0e19\u0e40\u0e01\u0e48\u0e32) \u0e42\u0e1b\u0e40\u0e01\u0e21\u0e2d\u0e19\u0e23\u0e48\u0e32\u0e07\u0e43\u0e2b\u0e21\u0e48\u0e17\u0e35\u0e48\u0e40\u0e23\u0e35\u0e22\u0e01\u0e27\u0e48\u0e32 \\\"\u0e40\u0e21\u0e01\u0e32\u0e2d\u0e35\u0e42\u0e27\u0e25\u0e39\u0e0a\u0e31\u0e19\\\" (Mega Evolution) \u0e43\u0e2b\u0e49\u0e1c\u0e39\u0e49\u0e40\u0e25\u0e48\u0e19\u0e1e\u0e31\u0e12\u0e19\u0e32\u0e23\u0e48\u0e32\u0e07\u0e15\u0e48\u0e2d\u0e08\u0e32\u0e01\u0e23\u0e48\u0e32\u0e07\u0e2a\u0e38\u0e14\u0e17\u0e49\u0e32\u0e22\u0e2d\u0e2d\u0e01\u0e44\u0e1b\u0e2d\u0e35\u0e01 \u0e42\u0e14\u0e22\u0e1b\u0e31\u0e08\u0e08\u0e38\u0e1a\u0e31\u0e19\u0e21\u0e35\u0e23\u0e48\u0e32\u0e07\u0e43\u0e2b\u0e21\u0e48 30 \u0e23\u0e48\u0e32\u0e07 \u0e40\u0e01\u0e21\u0e17\u0e31\u0e49\u0e07\u0e2a\u0e2d\u
