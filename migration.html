<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oracle migration (temporary)</title><style>body{background:#101827;color:#f0f4ff;font:14px system-ui;margin:0;padding:22px}main{max-width:880px;margin:auto}button,input{font:inherit}button{background:#2766ca;color:white;border:0;border-radius:8px;padding:11px;cursor:pointer}button:disabled{opacity:.45}input[type=password]{background:#1b2840;color:white;border:1px solid #516581;border-radius:6px;padding:10px;width:min(400px,90%)}label{display:inline-block;margin:10px}section{background:#1b2840;padding:14px;border-radius:12px;margin:15px 0}pre{white-space:pre-wrap;max-height:260px;overflow:auto}progress{width:100%;height:18px}small{color:#b6c8e4}</style></head><body><main><h2>ย้ายไฟล์ Supabase → Oracle (ชั่วคราว)</h2><p>คัดลอกเท่านั้น ไม่ลบต้นฉบับ และไม่เปลี่ยน URL เกม</p><section><p><label>Migration Admin Token<br><input id="token" type="password" autocomplete="off" placeholder="รหัส MIGRATION_ADMIN_TOKEN"></label></p><div id="cats"></div><p><button id="scan">วิเคราะห์ไฟล์</button> <button id="copy" disabled>เริ่มคัดลอก</button> <button id="pause" disabled>พัก</button> <button id="cancel" disabled>ยกเลิก</button> <button id="verify" disabled>ตรวจสอบไฟล์</button></p></section><section><strong id="status">ยังไม่ได้วิเคราะห์</strong><p><progress id="bar" value="0" max="1"></progress></p><small id="counts"></small><pre id="log"></pre></section><small>หมายเหตุ: ไฟล์เกิน 40 MiB จะไม่ถูกคัดลอกด้วยเครื่องมือนี้ และ ROM ใน Bucket Private ยังไม่สามารถเล่นผ่าน URL ตรงได้</small></main><script>
(()=>{'use strict';
const groups={covers:'ภาพปก',marquee:'ภาพหน้าแรก',skins:'สกิน',other:'ไฟล์ประกอบและเพลง',roms:'ROM',downloads:'ไฟล์ดาวน์โหลด'};
const cats=document.getElementById('cats'),log=document.getElementById('log'),status=document.getElementById('status'),counts=document.getElementById('counts'),bar=document.getElementById('bar');
for(const [key,name] of Object.entries(groups)){const label=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.value=key;cb.checked=true;label.append(cb,document.createTextNode(' '+name));cats.append(label)}
let files=[],stopped=false,paused=false,running=false,done=0,errors=0;
const btn=id=>document.getElementById(id);const say=s=>{log.textContent+=s+'\n';log.scrollTop=log.scrollHeight};
const set=s=>{status.textContent=s;counts.textContent=done+' / '+files.length+' ไฟล์, ผิดพลาด '+errors;bar.max=Math.max(1,files.length);bar.value=done};
const api=async body=>{const token=btn('token').value.trim();if(token.length<24)throw Error('กรุณาใส่ Migration Admin Token อย่างน้อย 24 ตัวอักษร');const res=await fetch('/api/migration',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body),cache:'no-store'});const data=await res.json().catch(()=>({error:'Invalid server response'}));if(!res.ok)throw Error(data.error||'HTTP '+res.status);return data};
btn('scan').onclick=async()=>{if(running)return;btn('scan').disabled=true;try{log.textContent='';done=errors=0;const categories=[...cats.querySelectorAll('input:checked')].map(x=>x.value);set('กำลังวิเคราะห์');const data=await api({action:'list',categories});files=data.files;set('พบ '+files.length+' ไฟล์ ('+(data.bytes/1048576).toFixed(1)+' MiB)');btn('copy').disabled=!files.length;btn('verify').disabled=!files.length;say('พร้อมคัดลอก: '+files.length+' ไฟล์')}catch(e){set('วิเคราะห์ไม่สำเร็จ');say(e.message)}finally{btn('scan').disabled=false}};
const work=async action=>{if(running||!files.length)return;running=true;stopped=paused=false;done=errors=0;btn('scan').disabled=btn('copy').disabled=btn('verify').disabled=true;btn('pause').disabled=btn('cancel').disabled=false;btn('pause').textContent='พัก';for(const file of files){if(stopped)break;while(paused&&!stopped)await new Promise(r=>setTimeout(r,250));if(stopped)break;try{const result=await api({action,key:file.key,expectedSize:file.size});if(result.status==='missing'||result.status==='size-mismatch')errors++;say(result.status+' '+file.key)}catch(e){errors++;say('ERROR '+file.key+': '+e.message)}done++;set(action==='copy'?'กำลังคัดลอก':'กำลังตรวจสอบ')}running=false;btn('scan').disabled=false;btn('copy').disabled=btn('verify').disabled=false;btn('pause').disabled=btn('cancel').disabled=true;set(stopped?'ยกเลิกแล้ว':'เสร็จสิ้น')};
btn('copy').onclick=()=>work('copy');btn('verify').onclick=()=>work('verify');btn('pause').onclick=()=>{paused=!paused;btn('pause').textContent=paused?'ทำต่อ':'พัก'};btn('cancel').onclick=()=>{stopped=true;paused=false;say('กำลังยกเลิกหลังคำขอปัจจุบัน')};
})();
</script></body></html>
